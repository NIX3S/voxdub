[package]
name = "voxdub"
version = "0.2.0"
edition = "2021"
description = "Transcription -> traduction -> clonage vocal (dubbing) pour fichiers audio, 100% offline."

[dependencies]
eframe = "0.28"
egui = "0.28"
rfd = "0.14"
rodio = { version = "0.19", features = ["symphonia-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"

[profile.release]
opt-level = 3
