name: build

on:
  push:
    branches: [main]
    tags: ['v*'] # Déclenche le workflow lors de la création d'un tag (ex: v1.0.0)
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: voxdub-windows-x64
            bin_name: voxdub.exe
          - os: macos-latest
            artifact: voxdub-macos-arm64
            bin_name: voxdub
          - os: ubuntu-latest
            artifact: voxdub-linux-x64
            bin_name: voxdub

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI/audio dev packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxkbcommon-dev libssl-dev \
            libasound2-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release

      - name: Stage artifact contents
        shell: bash
        run: |
          set -e
          mkdir -p dist
          cp "target/release/${{ matrix.bin_name }}" dist/
          [ -d scripts ] && cp -r scripts dist/ || echo "Pas de dossier scripts"
          [ -f README.md ] && cp README.md dist/ || echo "Pas de README.md"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  # --- NOUVEAU JOB POUR LA RELEASE ---
  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') # S'exécute uniquement si c'est un tag v*
    runs-on: ubuntu-latest
    permissions:
      contents: write # Requis pour créer une release et y attacher des fichiers

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts # Télécharge tous les artefacts dans ce dossier

      - name: Zip artifacts for release
        run: |
          mkdir release_assets
          cd artifacts
          for dir in */; do
            zip -r "../release_assets/${dir%/}.zip" "$dir"
          done

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*.zip
          generate_release_notes: true # Génère automatiquement le changelog basé sur les PRs/commits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
